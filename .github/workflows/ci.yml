      #   run: |
      #     docker tag ecopulse-ai:latest ${{ secrets.DOCKER_REGISTRY }}/ecopulse-ai:latest
      #     docker tag ecopulse-ai:latest ${{ secrets.DOCKER_REGISTRY }}/ecopulse-ai:${{ github.sha }}
      #     docker push ${{ secrets.DOCKER_REGISTRY }}/ecopulse-ai:latest
      #     docker push ${{ secrets.DOCKER_REGISTRY }}/ecopulse-ai:${{ github.sha }}

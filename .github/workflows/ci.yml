# =============================================================================
# EcoPulse AI — GitHub Actions CI/CD Pipeline
# =============================================================================
# This workflow runs code-quality checks, unit tests, dataset validation,
# model risk / quality gates, and an optional Docker image build on every
# push or pull-request targeting the main (or master) branch.
# =============================================================================

name: EcoPulse AI CI/CD

# ---------------------------------------------------------------------------
# Triggers
# ---------------------------------------------------------------------------
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel in-progress runs for the same branch / PR to save runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ---------------------------------------------------------------------------
# Jobs
# ---------------------------------------------------------------------------
jobs:

  # =========================================================================
  # 1. LINT — Code quality / syntax check
  # =========================================================================
  lint:
    name: Lint & Syntax Check
    runs-on: ubuntu-latest

    steps:
      # -- Checkout the repository ------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # -- Setup Python -----------------------------------------------------
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # -- Cache pip packages -----------------------------------------------
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-lint-
            ${{ runner.os }}-pip-

      # -- Install flake8 for linting ---------------------------------------
      - name: Install flake8
        run: pip install flake8

      # -- Run flake8 (non-blocking informational lint) ---------------------
      - name: Run flake8 lint
        run: |
          # E501: line too long — relaxed for ML projects
          # W503: line break before binary operator — PEP 8 now prefers this
          flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 src/ --count --exit-zero --max-line-length=120 --statistics

      # -- Compile-check every .py file in src/ ----------------------------
      - name: Syntax-check all Python files
        run: find src -name "*.py" -exec python -m py_compile {} +

  # =========================================================================
  # 2. TEST — Unit tests (depends on lint)
  # =========================================================================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-test-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-test-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest checks
        run: python -m pytest tests/test_deepchecks_compat.py tests/test_observability.py tests/test_registry.py tests/test_risk_quality_reporting.py tests/test_tracking.py -v

  # =========================================================================
  # 3. VALIDATE-DATASET — YOLO dataset structure validation (depends on lint)
  # =========================================================================
  validate-dataset:
    name: Validate Dataset
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-validate-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-validate-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        if: hashFiles('artifacts/datasets/processed/data.yaml') != ''
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate YOLO dataset
        if: hashFiles('artifacts/datasets/processed/data.yaml') != ''
        run: python src/data/validate_yolo_dataset.py --root artifacts/datasets/processed

  # =========================================================================
  # 4. MODEL-QUALITY-GATE — Risk & quality checks (depends on test)
  # =========================================================================
  model-quality-gate:
    name: Model Quality Gate
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-quality-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-quality-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        if: hashFiles('artifacts/checkpoints/yolo11n_best.pt') != '' && hashFiles('artifacts/datasets/processed/data.yaml') != ''
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-quality.txt

      - name: Run model risk & quality checks
        if: hashFiles('artifacts/checkpoints/yolo11n_best.pt') != '' && hashFiles('artifacts/datasets/processed/data.yaml') != ''
        run: |
          python src/models/evaluate.py --checkpoint artifacts/checkpoints/yolo11n_best.pt --split test --no-mlflow
          python src/models/risk_quality_checks.py --checkpoint yolo11n

  # =========================================================================
  # 5. DOCKER-BUILD — Build the Docker image (depends on test, push only)
  # =========================================================================
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    # Only build the image on pushes to main/master — skip for PRs.
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -- Build the Docker image -------------------------------------------
      - name: Build Docker image
        run: docker build -t ecopulse-ai:latest .

      # -- (Optional) Push to a container registry --------------------------
      # Uncomment the block below and add DOCKER_REGISTRY / DOCKER_USERNAME /
      # DOCKER_PASSWORD as repository secrets to enable automatic pushes.
      #
      # - name: Log in to Docker registry
      #   uses: docker/login-action@v3
      #   with:
      #     registry: ${{ secrets.DOCKER_REGISTRY }}
      #     username: ${{ secrets.DOCKER_USERNAME }}
      #     password: ${{ secrets.DOCKER_PASSWORD }}

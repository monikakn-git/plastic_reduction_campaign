name: AI Waste Reduction Campaign CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  code-quality-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-glx libglib2.0-0

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest httpx
          pip install -r requirements.txt

      - name: Code Quality & Lint Checks
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 src tests --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 src tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Pytest Test Suite
        run: |
          pytest tests/ -v --junitxml=reports/test-results.xml

  build-and-package:
    needs: code-quality-and-tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t waste-reduction-api:${{ github.sha }} .
          docker tag waste-reduction-api:${{ github.sha }} waste-reduction-api:latest

      - name: Docker Container Smoke Test
        run: |
          docker run -d -p 8000:8000 --name test-api waste-reduction-api:latest
          sleep 8
          curl -f http://localhost:8000/health || exit 1
          docker stop test-api

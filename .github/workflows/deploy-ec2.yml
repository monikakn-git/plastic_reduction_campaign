name: Deploy EcoPulse to EC2

on:
  workflow_dispatch:

concurrency:
  group: ecopulse-ec2-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy over SSH
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Package tracked source
        run: git archive --format=tar.gz --output=/tmp/ecopulse-release.tar.gz HEAD

      - name: Copy release to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: scp -i ~/.ssh/id_ed25519 /tmp/ecopulse-release.tar.gz "$EC2_USER@$EC2_HOST:/tmp/ecopulse-release.tar.gz"

      - name: Build, deploy, and check health
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "$EC2_USER@$EC2_HOST" 'set -eu
            mkdir -p "$HOME/ecopulse"
            tar -xzf /tmp/ecopulse-release.tar.gz -C "$HOME/ecopulse"
            cd "$HOME/ecopulse"
            docker compose up --build -d
            for i in $(seq 1 30); do
              if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
                docker compose ps
                exit 0
              fi
              sleep 10
            done
            docker compose logs --tail=100 api
            exit 1'

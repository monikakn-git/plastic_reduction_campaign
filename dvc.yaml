stages:
  validate_dataset:
    cmd: python src/data/validate_yolo_dataset.py
    deps:
      - src/data/validate_yolo_dataset.py
      - artifacts/datasets/processed/data.yaml

  evaluate_yolo11n:
    cmd: python src/models/evaluate.py --checkpoint artifacts/checkpoints/yolo11n_best.pt --split test --no-mlflow
    deps:
      - src/models/evaluate.py
      - artifacts/checkpoints/yolo11n_best.pt
      - artifacts/datasets/processed/data.yaml
    outs:
      - reports/yolo11n_best_test_evaluation.json:
          cache: false
      - reports/yolo11n_best_test_evaluation.md:
          cache: false

  evaluate_yolov8n:
    cmd: python src/models/evaluate.py --checkpoint artifacts/checkpoints/yolov8n_best.pt --split test --no-mlflow
    deps:
      - src/models/evaluate.py
      - artifacts/checkpoints/yolov8n_best.pt
      - artifacts/datasets/processed/data.yaml
    outs:
      - reports/yolov8n_best_test_evaluation.json:
          cache: false
      - reports/yolov8n_best_test_evaluation.md:
          cache: false


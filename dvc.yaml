stages:
  verify_dataset:
    cmd: python src/data/verify_dataset.py
    deps:
      - src/data/verify_dataset.py
      - data/raw/pLitterStreet
      - params.yaml
    outs:
      - reports/dataset_approval_report.md
      - reports/dataset_verification.json

  preprocess_and_split:
    cmd: python src/data/preprocess_coco_to_yolo.py
    deps:
      - src/data/preprocess_coco_to_yolo.py
      - data/raw/pLitterStreet
      - params.yaml
    outs:
      - data/processed/pLitterStreet/dataset.yaml
      - reports/eda_report.md

  train_baseline:
    cmd: python src/models/train_baseline.py
    deps:
      - src/models/train_baseline.py
      - data/processed/pLitterStreet/dataset.yaml
      - params.yaml
    outs:
      - models/baseline_yolov8.pt

  evaluate:
    cmd: python src/models/evaluate.py
    deps:
      - src/models/evaluate.py
      - models/baseline_yolov8.pt
      - params.yaml
    outs:
      - reports/model_evaluation_report.md

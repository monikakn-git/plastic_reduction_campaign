base:
  project_name: "AI-Based Waste Reduction Campaign"
  random_seed: 42

dataset:
  name: "pLitterStreet"
  raw_dir: "data/raw/pLitterStreet"
  processed_dir: "data/processed/pLitterStreet"
  annotation_file: "data/raw/pLitterStreet/annotations.json"
  images_dir: "data/raw/pLitterStreet/images"
  
  # Target 4-class scheme from pLitterStreet
  classes:
    0: "plastic"
    1: "waste_pile"
    2: "face_mask"
    3: "trash_bin"

  # Split proportions
  train_split: 0.70
  val_split: 0.15
  test_split: 0.15

train:
  model_type: "yolov8n.pt"  # Pretrained YOLOv8 nano backbone
  image_size: 640
  batch_size: 16
  epochs: 30
  optimizer: "AdamW"
  lr0: 0.001
  device: "cpu"  # Can be "0" for GPU if available or "cpu"

mlflow:
  experiment_name: "AI_Waste_Reduction_Campaign"
  tracking_uri: "mlruns"
  model_name: "pLitterStreet-WasteDetector"

quality_gate:
  min_precision: 0.60
  min_recall: 0.55
  min_map50: 0.60
  min_map50_95: 0.40
  max_inference_latency_ms: 100.0

campaign:
  severity_weights:
    waste_pile: 3.0
    plastic: 1.5
    face_mask: 1.0
    trash_bin: -1.0 # Bins reduce urgency in vicinity
  hotspot_radius_meters: 250
  high_priority_threshold: 15.0

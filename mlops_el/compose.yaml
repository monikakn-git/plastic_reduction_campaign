services:
  detector:
    build:
      context: .
    image: ${DEPLOY_IMAGE:-mlops-el-inference:phase2}
    ports:
      - "127.0.0.1:${API_PORT:-8011}:8000"
    volumes:
      - ${MODEL_RELEASE_DIR:-./releases/yolo11m-demo-v3}:/models:ro
    read_only: true
    tmpfs:
      - /tmp:size=268435456
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 2g
    cpus: 2
